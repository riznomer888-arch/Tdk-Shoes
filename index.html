<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TDK-SHOES — Интернет-магазин одежды и обуви</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="site-header">
        <div class="top-promo-bar">
            ЛЕТНЯЯ ВЫПРОДАЖА | ДО -40% НА ВЫБРАННЫЕ ТОВАРЫ | БЕСПЛАТНАЯ ДОСТАВКА В КАЗАХСТАН
        </div>
        
        <div class="header-main">
            <h1 class="logo" onclick="changeCategory('all')">TDK-SHOES</h1>
        </div>

        <nav class="main-navigation">
            <div class="nav-links">
                <a href="#" class="nav-link active" id="nav-all" onclick="changeCategory('all')">ВСЕ ТОВАРЫ</a>
                <a href="#" class="nav-link" id="nav-shoes" onclick="changeCategory('shoes')">ОБУВЬ</a>
                <a href="#" class="nav-link" id="nav-bags" onclick="changeCategory('bags')">СУМКИ</a>
                <a href="#" class="nav-link" id="nav-jeans" onclick="changeCategory('jeans')">ДЖИНСЫ</a>
            </div>
            
            <div class="search-wrapper">
                <input type="text" id="search-input" placeholder="Искать бренд или вещь...">
                <span class="search-icon">🔍</span>
            </div>
        </nav>
    </header>

    <main class="catalog-container">
        <div class="brand-hero-section">
            <h2 class="category-title">Balenciaga</h2>
            <p class="category-subtitle">брендовые и эксклюзивные коллекции</p>
        </div>
        
        <div id="products-container" class="products-grid">
            </div>
    </main>

    <div id="product-detail-modal" class="side-modal">
        <div class="modal-overlay" onclick="closeProductModal()"></div>
        <div class="modal-content">
            <button class="close-modal-btn" onclick="closeProductModal()">×</button>
            
            <div class="modal-body-scroll">
                <div class="modal-gallery">
                    <div class="main-preview-box">
                        <img id="modal-main-preview" src="" alt="product preview">
                    </div>
                    <div id="modal-thumbnails" class="thumbnails-container">
                        </div>
                </div>

                <div class="modal-info">
                    <span class="modal-status-badge"></span>
                    <h2 class="modal-brand"></h2>
                    <h3 class="modal-product-name"></h3>
                    <p class="modal-sku"></p>
                    
                    <div class="modal-price-box">
                        <span class="modal-price"></span>
                        <span class="modal-installment"></span>
                    </div>

                    <div class="size-section">
                        <h4>ВЫБЕРИТЕ РАЗМЕР:</h4>
                        <div class="modal-sizes-selector">
                            </div>
                    </div>

                    <div class="order-form-container">
                        <h4>ОФОРМЛЕНИЕ БЫСТРОГО ЗАКАЗА</h4>
                        <form id="telegram-checkout-form">
                            <div class="input-group">
                                <label for="order-name">Ваше Имя</label>
                                <input type="text" id="order-name" required placeholder="Иван Иванов">
                            </div>
                            <div class="input-group">
                                <label for="order-phone">Телефон (WhatsApp)</label>
                                <input type="tel" id="order-phone" required placeholder="+7 (707) 123-4567">
                            </div>
                            <div class="input-group">
                                <label for="order-address">Адрес доставки</label>
                                <input type="text" id="order-address" required placeholder="г. Талдыкорган, ул. Толе би, д. 10">
                            </div>
                            
                            <button type="submit" id="checkout-submit-btn" class="buy-now-btn">
                                ОТПРАВИТЬ ЗАКАЗ БАЙЕРУ
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
